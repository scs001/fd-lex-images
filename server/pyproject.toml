[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fd-lex-api"
version = "0.1.0"
description = "识律(lex) 平台服务端：结算/分发/后台 API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
    # 控制台 Logto ID token 本地校验（JWKS/iss/aud/exp）；crypto extra 供 ES384。
    "pyjwt[crypto]>=2.8",
    # 生产库=PG（接客硬前提，2026-10-12 迁移）：psycopg3 驱动 + alembic 迁移链。
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]
mongo = [
    "pymongo>=4.6",
]

[tool.setuptools]
packages = [
    "fd_lex_api",
    "fd_lex_api.metering",
    "fd_lex_api.billing",
    "fd_lex_api.console_api",
    "fd_lex_api.admin_api",
    "fd_lex_api.distribution",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
