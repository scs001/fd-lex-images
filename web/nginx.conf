server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 容器健康检查端点（不经缓存）
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok';
    }

    # SPA 路由回退：/ /console /admin 全部落 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
